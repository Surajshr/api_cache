name: api_cache
description: A Flutter package for caching API responses with expiration support using Hive.
version: 1.0.0
homepage: https://github.com/Surajshr/api_cache
repository: https://github.com/Surajshr/api_cache
issue_tracker: https://github.com/Surajshr/api_cache/issues
documentation: https://github.com/Surajshr/api_cache#readme
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  hive: ^2.2.3
  path_provider: ^2.1.2
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
  flutter_test:
    sdk: flutter
